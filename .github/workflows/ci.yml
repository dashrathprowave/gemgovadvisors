name: CI/CD

on:
  push:
    branches: [master, staging]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# One run per ref at a time; never cancel a deploy that is mid-extract.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test-frontend:
    name: Frontend — lint, test, build, smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      - name: Build deployment bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/build-bundle.mjs

      - name: Keep bundle for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: frontend/deploy.tar.gz
          retention-days: 1
          if-no-files-found: error

  test-backend:
    name: Backend — syntax + app import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Syntax check (no dependencies needed)
        run: python -m compileall -q api db rag ingestion tenders analytics scripts config.py main.py models.py

      - name: Install CPU torch first (keeps RAM use low)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: FastAPI app assembles
        # Imports every router + config. Does NOT download ML models and does
        # NOT connect to any database — model warmup only runs in lifespan
        # when uvicorn actually starts.
        run: python -c "from main import app; print('routes:', len(app.routes))"

