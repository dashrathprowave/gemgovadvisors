name: CI/CD

on:
  push:
    branches: [master, staging]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# One run per ref at a time; never cancel a deploy that is mid-extract.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Lint, test, build, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      - name: Build deployment bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/build-bundle.mjs

      - name: Keep bundle for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy.tar.gz
          retention-days: 1
          if-no-files-found: error

