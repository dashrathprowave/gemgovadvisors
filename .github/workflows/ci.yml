  #           pm2 save
  #
  #           echo "Staging deployment completed successfully."

  # ==========================================
  # PRODUCTION DEPLOYMENT (frontend + backend)
  # ==========================================

  deploy:
    name: Deploy to VPS (frontend + backend)
    needs: [test-frontend, test-backend]

    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_VPS_HOST }}
          username: ${{ secrets.STAGING_VPS_USER }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY }}
          # First backend boot downloads ~3 GB of ML models — the default
          # 10-minute SSH timeout kills the session mid-download.
          command_timeout: 30m

          script: |
            set -e

            cd "/var/www/e390b8b3-078c-4b25-9f4b-294a2930f348/public_html"

            echo "Pulling latest production code..."
            git fetch origin
            git checkout master
            git reset --hard origin/master

            echo "=== Frontend ==="
            cd frontend
            echo "Installing dependencies..."
            npm ci
            echo "Building frontend..."
            npm run build
            echo "Restarting production frontend..."
            pm2 restart frontend || pm2 start npm --name "frontend" -- start
            cd ..

            echo "=== Backend (FastAPI chatbot) ==="
            cd backend
            if [ ! -d venv ]; then
              echo "Creating Python venv (first deploy only)..."
              python3 -m venv venv
            fi
            echo "Refreshing backend dependencies..."
            venv/bin/pip install --upgrade pip
            venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch
            venv/bin/pip install -r requirements.txt
            echo "Restarting production backend..."
            pm2 restart chatbot-backend || pm2 start "$PWD/venv/bin/python" --name "chatbot-backend" -- -m uvicorn main:app --host 0.0.0.0 --port 8000
            cd ..

            pm2 save

            echo "Waiting for backend http://127.0.0.1:8000/health ..."
            for i in $(seq 1 60); do
              if curl -sf -m 5 http://127.0.0.1:8000/health >/dev/null 2>&1; then
                echo "Backend healthy."
                break
              fi
              if [ "$i" = "60" ]; then
                echo "Backend health check FAILED after 10 minutes."
                echo "Last log lines:"
                pm2 logs chatbot-backend --lines 30 --nostream || true
                exit 1
              fi
              sleep 10
            done

            echo "Production deployment completed successfully (frontend + backend)."
